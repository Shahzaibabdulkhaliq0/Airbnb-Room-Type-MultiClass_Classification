make_dataset:
  S3_BUCKET: airbnb-project-s3-bucket
  S3_KEY: AB_NYC_2019.csv
  DROP_COLUMNS: [id, name, host_id, host_name, last_review]
  FILL_REVIEWS_PER_MONTH: 0

validate_data:
  REQUIRED_COLUMNS: [latitude, longitude, price, minimum_nights, number_of_reviews, reviews_per_month, calculated_host_listings_count, availability_365, room_type, neighbourhood_group, neighbourhood]
  MIN_ROWS: 1000
  MIN_PRICE: 0
  MIN_AVAILABILITY: 0
  MAX_AVAILABILITY: 365
  ALLOWED_ROOM_TYPES: [Entire home/apt, Private room, Shared room]
  MAX_NULL_SHARE: 0.5

build_features:
  TARGET: room_type
  TEST_SIZE: 0.2
  RANDOM_STATE: 42
  PRICE_CAP_QUANTILE: 0.99
  MIN_NIGHTS_CAP_QUANTILE: 0.99

train_model:
  TARGET: room_type
  RANDOM_STATE: 42
  CV_FOLDS: 3

tune_model:
  TARGET: room_type
  RANDOM_STATE: 42
  CV_FOLDS: 3
  N_ITER: 10
  SCORING: f1_macro
  PARAM_GRIDS:
    Logistic Regression:
      classifier__C: [0.1, 1, 10]
    Decision Tree:
      classifier__max_depth: [5, 10, null]
      classifier__min_samples_split: [2, 5, 10]
    Random Forest:
      classifier__n_estimators: [100, 150, 200, 300]
      classifier__max_depth: [8, 12, 15, 20, null]
      classifier__min_samples_split: [2, 5, 10]
    Gradient Boosting:
      classifier__n_estimators: [100, 200]
      classifier__max_depth: [3, 5]

evaluate_model:
  TARGET: room_type
  REGISTERED_MODEL_NAME: my_model
  
mlflow:
  TRACKING_URI: https://dagshub.com/Shahzaibabdulkhaliq0/Airbnb-Room-Type-MultiClass_Classification.mlflow
  EXPERIMENT_NAME: Airbnb